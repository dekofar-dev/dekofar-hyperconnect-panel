<div class="card">

  <!-- ===================================================== -->
  <!-- 🔹 HEADER -->
  <!-- ===================================================== -->
  <div class="card-header align-items-center justify-content-between">

    <h3 class="card-title">
      Sipariş Listesi (Gönderilmemiş / Kısmen Gönderilmiş – Ürün Bazlı)
    </h3>

    <div class="card-toolbar">
      <div class="d-flex gap-3 align-items-center flex-wrap">

        <!-- ================= SEARCH ================= -->
        <div class="position-relative">
          <input
            type="text"
            class="form-control form-control-sm"
            placeholder="Etiket ile ara (DHL, KARGO, VIP...)"
            [formControl]="tagSearch"
            (keyup.enter)="search()"
            style="min-width:220px;"
          />

          <button
            *ngIf="tagSearch.value"
            class="btn btn-sm btn-icon btn-light position-absolute top-50 end-0 translate-middle-y me-2"
            (click)="clearSearch()">
            ✕
          </button>
        </div>

        <!-- ================= SEARCH BUTTON ================= -->
        <button
          class="btn btn-sm btn-primary"
          (click)="search()"
          [disabled]="loading">
          Ara
        </button>

        <!-- ================= REFRESH ================= -->
        <button
          class="btn btn-sm btn-light"
          (click)="loadProducts(activeTag)"
          [disabled]="loading">
          Yenile
        </button>

      </div>
    </div>
  </div>

  <!-- ===================================================== -->
  <!-- 🔹 BODY -->
  <!-- ===================================================== -->
  <div class="card-body">

    <div *ngIf="loading" class="text-muted">
      Yükleniyor…
    </div>

    <div *ngIf="!loading && products.length === 0" class="text-muted">
      Kayıt bulunamadı.
    </div>

    <!-- ================= PRODUCTS ================= -->
    <div *ngIf="!loading && products.length > 0" class="row g-6">

      <div
        class="col-12 col-md-6 col-xl-4"
        *ngFor="let p of products; trackBy: trackProduct">

        <div class="card shadow-sm h-100">
          <div class="card-body">

            <div class="d-flex align-items-center mb-4">
              <img
                *ngIf="p.productImageUrl"
                [src]="p.productImageUrl"
                style="width:64px;height:64px;object-fit:cover;border-radius:10px;margin-right:12px;">

              <div class="flex-grow-1">
                <div class="fw-bold">{{ p.productTitle }}</div>
                <div class="text-muted fs-7">Toplam Adet</div>
              </div>

              <div class="fs-4 fw-bolder">
                {{ p.totalQuantity }}
              </div>
            </div>

            <div class="row g-3">
              <div
                class="col-12"
                *ngFor="let v of p.variants; trackBy: trackVariant">

                <div class="border rounded-3 px-3 py-2 d-flex justify-content-between">
                  <span class="badge badge-light-dark">
                    {{ v.variantTitle || 'Standart' }}
                  </span>
                  <span class="fw-semibold">
                    {{ v.quantity }}
                  </span>
                </div>

              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- ================= TOTAL ================= -->
    <div
      *ngIf="!loading && products.length > 0"
      class="mt-6 d-flex justify-content-end">

      <div class="border rounded-3 px-4 py-3 bg-light fw-bold">
        Genel Toplam: {{ grandTotal }}
      </div>
    </div>

  </div>
</div>
